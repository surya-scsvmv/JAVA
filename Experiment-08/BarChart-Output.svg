<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">BarChart Java Applet — Original Output Illustration</title>
  <desc id="desc">Five subject marks represented as bars. Values at least 50 are green; values below 50 are red. Click feedback is illustrated below the chart.</desc>
  <rect width="760" height="420" rx="18" fill="#fbfcfe"/>
  <rect x="18" y="18" width="724" height="384" rx="12" fill="#ffffff" stroke="#d8dee8"/>
  <text x="42" y="53" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#172033">BarChart.java</text>
  <text x="42" y="77" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#596579">Original output illustration based on the marks in this repository's source</text>
  <text x="42" y="110" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#344054">Click a bar</text>
  <line x1="65" y1="305" x2="690" y2="305" stroke="#64748b" stroke-width="1.5"/>
  <line x1="65" y1="135" x2="65" y2="305" stroke="#64748b" stroke-width="1.5"/>
  <line x1="65" y1="220" x2="690" y2="220" stroke="#e7ebf1" stroke-dasharray="4 5"/>
  <line x1="65" y1="135" x2="690" y2="135" stroke="#e7ebf1" stroke-dasharray="4 5"/>
  <text x="37" y="309" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#596579">0</text>
  <text x="28" y="224" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#596579">50</text>
  <text x="22" y="139" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#596579">100</text>
  <rect x="112" y="172.4" width="58" height="132.6" rx="4" fill="#22a06b"/>
  <rect x="222" y="150.3" width="58" height="154.7" rx="4" fill="#22a06b"/>
  <rect x="332" y="228.5" width="58" height="76.5" rx="4" fill="#dc4545"/>
  <rect x="442" y="192.8" width="58" height="112.2" rx="4" fill="#22a06b"/>
  <rect x="552" y="155.4" width="58" height="149.6" rx="4" fill="#22a06b"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#172033" text-anchor="middle">
    <text x="141" y="163">78</text><text x="251" y="141">91</text><text x="361" y="220">45</text><text x="471" y="184">66</text><text x="581" y="146">88</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#596579" text-anchor="middle">
    <text x="141" y="326">Subject 1</text><text x="251" y="326">Subject 2</text><text x="361" y="326">Subject 3</text><text x="471" y="326">Subject 4</text><text x="581" y="326">Subject 5</text>
  </g>
  <circle cx="52" cy="355" r="5" fill="#22a06b"/><text x="64" y="359" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#344054">Pass (50 and above)</text>
  <circle cx="238" cy="355" r="5" fill="#dc4545"/><text x="250" y="359" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#344054">Below 50</text>
  <rect x="430" y="341" width="276" height="34" rx="7" fill="#eef4ff" stroke="#c8d8f5"/>
  <text x="444" y="362" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#234a83">Example click: Subject 1 = 78</text>
  <text x="42" y="389" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#7a8495">Illustrative static diagram; the Java applet itself handles mouse clicks.</text>
</svg>